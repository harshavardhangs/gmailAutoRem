name: Unread Email Digest

on:
  schedule:
    # Runs every 15 minutes (GitHub requires >= 5 min intervals for cron)
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Ensure the job has explicit write permissions to push git commits
permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetch full history to prevent shallow commit issues during push
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth-oauthlib google-auth-httplib2 twilio python-dotenv

      - name: Restore token.json and Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          MY_WHATSAPP_NUMBER: ${{ secrets.MY_WHATSAPP_NUMBER }}
          GMAIL_TOKEN_CONTENT: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          echo "$GMAIL_TOKEN_CONTENT" > token.json
          python email_digest.py

      - name: Clean up sensitive files before git commit
        if: always()
        run: |
          # Guarantee token.json is removed before any git operations run
          rm -f token.json

      - name: Keepalive Heartbeat Commit
        run: |
          # Only executes on the 1st and 15th day of every month to prevent clutter
          CURRENT_DAY=$(date -u +%d)
          if [ "$CURRENT_DAY" = "01" ] || [ "$CURRENT_DAY" = "15" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            # Update a hidden heartbeat timestamp file
            date -u > .keepalive
            
            git add .keepalive
            # [skip ci] prevents the heartbeat commit itself from triggering additional runs
            git commit -m "chore(keepalive): automated repository heartbeat [skip ci]" || echo "No changes to commit"
            git push origin main || echo "Nothing to push"
          else
            echo "Skipping keepalive heartbeat (runs only on 1st and 15th of the month)."
          fi
